# YingShiCang update mirror on its own port, with its own certificate and log; no other site listens here.
limit_conn_zone $binary_remote_addr zone=ysc_update_ip:1m;
limit_conn_zone $server_port zone=ysc_update_all:1m;
log_format ysc_update '$time_iso8601 $status $body_bytes_sent $request_time "$request_uri"';

server {
    listen 18443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/ysc-update.crt;
    ssl_certificate_key /etc/nginx/ssl/ysc-update.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # No client IPs: only time, status, bytes and path, for download counts and traffic.
    access_log /var/log/nginx/ysc-update.access.log ysc_update;
    root /var/www/ysc-update;

    location = /ysc/latest.json {
        limit_except GET HEAD { deny all; }
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /ysc/download/ {
        limit_except GET HEAD { deny all; }
        limit_conn ysc_update_ip 2;
        limit_conn ysc_update_all 10;
        # Keeps release-day downloads from crowding out the server's other traffic.
        limit_rate 8m;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / { return 404; }
}
