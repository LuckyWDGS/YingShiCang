# Runs the same checks as `python scripts/check.py` on every push and pull request:
# TV (leanback) JVM unit tests, the mobile Java compile, and both Python service test roots.
# Needs no secrets: no signing, no release, no device. Native MPV/FFmpeg libraries are not built here
# (scripts/native/README.md), so APK packaging and playback are not covered.
name: check

# Pushes to main, and pull requests (which cover their branches: running on every branch push too ran each
# PR commit twice).
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Chaquopy builds the plugin runtime for Python 3.10 (chaquo/build.gradle) and needs a matching build Python.
      - name: Python 3.10
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          # compileSdk 37 and build-tools 36.0.0 (docs/build.md); the Android Gradle Plugin fetches anything else it misses.
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null \
            || echo "::warning::sdkmanager could not install the pinned packages; leaving it to the Android Gradle Plugin"

      # Media3 1.11.1 source with the FongMi patch, hash-locked by scripts/media3/sources.lock.json. Prepared
      # outside the checkout: prepare_media.py runs `git apply` in it, which inside this repository would treat
      # it as a subdirectory and skip the patch's paths.
      - name: Restore prepared Media3 source
        uses: actions/cache@v6
        with:
          path: ~/ysc-media3/media
          key: media3-${{ hashFiles('scripts/media3/sources.lock.json', 'scripts/media3/*.patch') }}

      - name: Prepare Media3 source
        run: |
          python scripts/prepare_media.py --destination "$HOME/ysc-media3/media"
          rm -f "$HOME/ysc-media3/androidx-media-1.11.1.zip"
          echo "MEDIA3_DIR=$HOME/ysc-media3/media" >> "$GITHUB_ENV"

      # decoder_ffmpeg/build.gradle.kts reads android.ndk.version from this file, which only the native import
      # (scripts/sync_media3_native.py) writes. CI builds no native code (no FFmpeg headers, no .so files), so a
      # stub with that one key, the version the import writes, lets Gradle configure.
      - name: Stub native manifest
        run: |
          props="$MEDIA3_DIR/libraries/decoder_ffmpeg/src/main/resources/META-INF/androidx.media3.decoder.ffmpeg/native-dependencies.properties"
          [ -f "$props" ] && exit 0
          mkdir -p "$(dirname "$props")"
          printf '%s\n' '# CI stub: no native libraries (see .github/workflows/check.yml).' \
            'manifest.kind=ci-stub' 'android.ndk.version=30.0.16248370' > "$props"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run checks
        env:
          PYTHON_BUILD: ${{ steps.python.outputs.python-path }}
        run: |
          set -o pipefail
          python scripts/check.py 2>&1 | tee "$RUNNER_TEMP/check.log"

      # Job logs need repository access to read; an annotation is public with the check run, so the reason a
      # check failed can be read without signing in (one annotation: GitHub keeps at most 10 errors per step).
      - name: Summarise failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/check.log"
          [ -f "$log" ] || exit 0
          {
            grep -A15 -E '^\* What went wrong' "$log" | head -60
            grep -E '> Task .* FAILED|tests completed, .* failed|^[A-Za-z0-9_.]+Test > .* FAILED|^(FAIL|ERROR): |^FAILED \(|error: ' "$log" | head -40
          } > "$RUNNER_TEMP/summary.txt" || true
          [ -s "$RUNNER_TEMP/summary.txt" ] || tail -40 "$log" > "$RUNNER_TEMP/summary.txt"
          message=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$RUNNER_TEMP/summary.txt" | awk '{printf "%s%%0A", $0}')
          echo "::error title=check failed::${message}"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
