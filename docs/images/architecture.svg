<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
  <defs>
    <style>
      .t{fill:#E9F3F7;font-size:17px;font-weight:600}
      .s{fill:#9DB3BE;font-size:13px}
      .h{fill:#56E0C2;font-size:14px;font-weight:700;letter-spacing:2px}
      .box{fill:#132631;stroke:#2C4856;stroke-width:1.5}
      .hi{fill:#173A3A;stroke:#56E0C2;stroke-width:1.5}
      .ext{fill:#1C1F2B;stroke:#4A4F6A;stroke-width:1.5;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1200" height="660" rx="20" fill="#0B1820"/>
  <text x="40" y="52" fill="#FFFFFF" font-size="26" font-weight="700">影视仓 · 模块结构</text>
  <text x="40" y="80" class="s">同一套代码构建电视版和手机版；目录名对应仓库中的模块</text>

  <!-- UI layer -->
  <text x="40" y="128" class="h">界面</text>
  <rect x="40" y="140" width="530" height="78" rx="12" class="hi"/>
  <text x="62" y="174" class="t">电视版 · leanback</text>
  <text x="62" y="200" class="s">遥控焦点、九个首页入口、详情与线路、直播、DLNA</text>
  <rect x="590" y="140" width="330" height="78" rx="12" class="box"/>
  <text x="612" y="174" class="t">手机版 · mobile</text>
  <text x="612" y="200" class="s">触屏手势、长按快进 / 倒放</text>
  <rect x="940" y="140" width="220" height="78" rx="12" class="box"/>
  <text x="962" y="174" class="t">Room 数据库</text>
  <text x="962" y="200" class="s">历史、收藏、站源、设置</text>

  <!-- content layer -->
  <text x="40" y="270" class="h">内容</text>
  <rect x="40" y="282" width="250" height="96" rx="12" class="box"/>
  <text x="62" y="316" class="t">TVBox 配置</text>
  <text x="62" y="342" class="s">点播 / 直播 / 壁纸</text>
  <text x="62" y="362" class="s">加载失败时用本地缓存</text>
  <rect x="310" y="282" width="610" height="96" rx="12" class="box"/>
  <text x="332" y="316" class="t">站源插件（Spider）</text>
  <g class="s">
    <rect x="332" y="330" width="170" height="34" rx="8" fill="#0F1F28" stroke="#2C4856"/>
    <text x="417" y="352" text-anchor="middle">Java / JAR · catvod</text>
    <rect x="514" y="330" width="170" height="34" rx="8" fill="#0F1F28" stroke="#2C4856"/>
    <text x="599" y="352" text-anchor="middle">JavaScript · quickjs</text>
    <rect x="696" y="330" width="206" height="34" rx="8" fill="#0F1F28" stroke="#2C4856"/>
    <text x="799" y="352" text-anchor="middle">Python · chaquo (Chaquopy)</text>
  </g>
  <rect x="940" y="282" width="220" height="96" rx="12" class="box"/>
  <text x="962" y="316" class="t">直播 / P2P 组件</text>
  <text x="962" y="342" class="s">app/libs 预编译包</text>
  <text x="962" y="362" class="s">forcetech、thunder、tvbus…</text>

  <!-- playback layer -->
  <text x="40" y="430" class="h">播放</text>
  <rect x="40" y="442" width="370" height="96" rx="12" class="hi"/>
  <text x="62" y="476" class="t">Media3 ExoPlayer（默认）</text>
  <text x="62" y="502" class="s">HLS / DASH、音轨与字幕、下一集预加载</text>
  <text x="62" y="522" class="s">硬解失败自动回退软解</text>
  <rect x="430" y="442" width="240" height="96" rx="12" class="box"/>
  <text x="452" y="476" class="t">MPV 内核</text>
  <text x="452" y="502" class="s">可手动切换</text>
  <text x="452" y="522" class="s">共用 libffmpeg.so</text>
  <rect x="690" y="442" width="230" height="96" rx="12" class="box"/>
  <text x="712" y="476" class="t">弹幕</text>
  <text x="712" y="502" class="s">media3-ui-danmaku</text>
  <text x="712" y="522" class="s">站源弹幕 / 弹幕接口搜索</text>
  <rect x="940" y="442" width="220" height="96" rx="12" class="box"/>
  <text x="962" y="476" class="t">本机服务</text>
  <text x="962" y="502" class="s">HTTP :9978 配置中心</text>
  <text x="962" y="522" class="s">插件代理、遥控推送</text>

  <!-- external -->
  <text x="40" y="584" class="h">外部</text>
  <rect x="120" y="562" width="500" height="64" rx="12" class="ext"/>
  <text x="142" y="590" class="t">GitHub Release · 更新镜像</text>
  <text x="142" y="612" class="s">检查更新、校验清单与 SHA-256（service/update_mirror）</text>
  <rect x="640" y="562" width="520" height="64" rx="12" class="ext"/>
  <text x="662" y="590" class="t">日志接收服务（可选，自行部署）</text>
  <text x="662" y="612" class="s">脱敏诊断日志 → 函数计算 → OSS（service/aliyun_fc）</text>

</svg>
