<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1820"/>
      <stop offset="1" stop-color="#14303D"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56E0C2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#56E0C2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen"><rect x="742" y="70" width="460" height="258" rx="10"/></clipPath>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="1040" cy="200" r="260" fill="url(#glow)"/>

  <!-- app icon (same shapes as app/src/main/res/drawable/ysc_icon.xml) -->
  <g transform="translate(72 84)">
    <rect width="104" height="104" rx="24" fill="#10202C" stroke="#56E0C2" stroke-opacity="0.35"/>
    <rect x="25" y="26" width="54" height="52" rx="4" fill="#56E0C2"/>
    <path d="M44 39 L44 69 L68 54 Z" fill="#10202C"/>
  </g>

  <text x="72" y="248" font-size="58" font-weight="700" fill="#FFFFFF">影视仓</text>
  <text x="270" y="248" font-size="30" font-weight="500" fill="#56E0C2" letter-spacing="1">YingShiCang</text>
  <text x="72" y="292" font-size="20" fill="#B9CCD6">为电视和盒子遥控设计的 Android 影视播放器，兼容 TVBox 配置</text>

  <g font-size="17" fill="#DDF7F1">
    <rect x="72" y="320" width="66" height="34" rx="17" fill="#56E0C2" fill-opacity="0.14" stroke="#56E0C2" stroke-opacity="0.45"/>
    <text x="105" y="343" text-anchor="middle">点播</text>
    <rect x="148" y="320" width="66" height="34" rx="17" fill="#56E0C2" fill-opacity="0.14" stroke="#56E0C2" stroke-opacity="0.45"/>
    <text x="181" y="343" text-anchor="middle">直播</text>
    <rect x="224" y="320" width="66" height="34" rx="17" fill="#56E0C2" fill-opacity="0.14" stroke="#56E0C2" stroke-opacity="0.45"/>
    <text x="257" y="343" text-anchor="middle">投屏</text>
    <rect x="300" y="320" width="118" height="34" rx="17" fill="#56E0C2" fill-opacity="0.14" stroke="#56E0C2" stroke-opacity="0.45"/>
    <text x="359" y="343" text-anchor="middle">局域网配置</text>
    <rect x="428" y="320" width="100" height="34" rx="17" fill="#56E0C2" fill-opacity="0.14" stroke="#56E0C2" stroke-opacity="0.45"/>
    <text x="478" y="343" text-anchor="middle">追剧提醒</text>
    <rect x="538" y="320" width="66" height="34" rx="17" fill="#56E0C2" fill-opacity="0.14" stroke="#56E0C2" stroke-opacity="0.45"/>
    <text x="571" y="343" text-anchor="middle">弹幕</text>
  </g>

  <!-- stylised TV (illustration, not a screenshot) -->
  <rect x="730" y="58" width="484" height="282" rx="18" fill="#08131A" stroke="#2E4B59" stroke-width="2"/>
  <path d="M922 340 L908 366 H1036 L1022 340 Z" fill="#1B3340"/>
  <g clip-path="url(#screen)">
    <rect x="742" y="70" width="460" height="258" fill="#0E1D26"/>
    <g font-size="11" fill="#7F99A6">
      <rect x="756" y="84" width="40" height="22" rx="11" fill="#56E0C2"/>
      <text x="776" y="99" text-anchor="middle" fill="#0B1820" font-weight="700">主页</text>
      <text x="826" y="99" text-anchor="middle">热播电影</text>
      <text x="884" y="99" text-anchor="middle">热播剧集</text>
      <text x="942" y="99" text-anchor="middle">热播综艺</text>
      <text x="1000" y="99" text-anchor="middle">电影筛选</text>
      <text x="1058" y="99" text-anchor="middle">电视筛选</text>
      <text x="1116" y="99" text-anchor="middle">电影榜单</text>
    </g>
    <g fill="#1A3240">
      <rect x="756" y="122" width="78" height="108" rx="8"/>
      <rect x="844" y="122" width="78" height="108" rx="8"/>
      <rect x="932" y="122" width="78" height="108" rx="8"/>
      <rect x="1020" y="122" width="78" height="108" rx="8"/>
      <rect x="1108" y="122" width="78" height="108" rx="8"/>
      <rect x="756" y="246" width="78" height="108" rx="8"/>
      <rect x="844" y="246" width="78" height="108" rx="8"/>
      <rect x="932" y="246" width="78" height="108" rx="8"/>
      <rect x="1020" y="246" width="78" height="108" rx="8"/>
      <rect x="1108" y="246" width="78" height="108" rx="8"/>
    </g>
    <rect x="841" y="119" width="84" height="114" rx="10" fill="none" stroke="#56E0C2" stroke-width="3"/>
    <path d="M873 166 L873 186 L889 176 Z" fill="#56E0C2" fill-opacity="0.8"/>
  </g>
</svg>
