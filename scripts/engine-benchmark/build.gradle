plugins { id 'com.android.application' version '9.0.1' }
android {
    namespace 'com.yingshicang.enginebench'
    compileSdk 36
    defaultConfig {
        applicationId 'com.yingshicang.enginebench'
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName '1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-mpvplayer:1.11.1'
    implementation 'androidx.media3:media3-decoder-ffmpeg:1.11.1'
}
