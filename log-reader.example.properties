# Template for scripts/fetch_logs.py (reading the logs devices upload to Aliyun OSS).
# Copy to log-reader.properties in the main checkout and fill in the two keys there.
# log-reader.properties is ignored by Git; never commit it or paste the keys anywhere else.
#
# Use the read-only RAM user ysc-log-reader (docs/日志上传-阿里云OSS部署.md), not the upload role.
# Environment variables OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET still win when they are set.

# Where the logs are (already correct for this project).
oss.endpoint=https://oss-cn-beijing.aliyuncs.com
oss.bucket=ying-shi-cang

# The read-only AccessKey of ysc-log-reader: no quotes, no spaces.
oss.accessKeyId=
oss.accessKeySecret=
